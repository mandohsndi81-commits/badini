<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badini Translate – وەرگێڕانی بادینی</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#161a2b;--mu:#6b7189;--bd:#e3e6f0;--pr:#1f9d55;--ac:#f4b400;--sh:0 8px 30px rgba(20,30,60,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1120;--card:#171b30;--tx:#eef0fa;--mu:#9aa1c0;--bd:#2a3050;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1120;--card:#171b30;--tx:#eef0fa;--mu:#9aa1c0;--bd:#2a3050;--sh:0 8px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:230px;background:var(--card);border-inline-end:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo img{flex-shrink:0}.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:700}.logo small{display:block;font-weight:400;color:var(--mu);font-size:11px}
nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--mu);text-decoration:none;cursor:pointer;font-weight:600;transition:.2s}
nav a:hover{background:var(--bg)}nav a.on{background:linear-gradient(90deg,var(--pr),#2bb673);color:#fff}
main{flex:1;padding:24px;max-width:1000px;margin:auto;min-width:0}
h1{margin:0 0 4px;font-size:26px}p.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
textarea,select,input[type=text]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit}
textarea{min-height:150px;resize:vertical}
.ku{direction:rtl;font-family:Vazirmatn,'Noto Naskh Arabic',Tahoma,sans-serif;font-size:17px;line-height:1.9}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:600 14px Inter,sans-serif;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.1)}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5}
.out{min-height:150px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;white-space:pre-wrap}
.mu{color:var(--mu);font-size:12px}.item{border-bottom:1px solid var(--bd);padding:10px 0}.item:last-child{border:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}@keyframes s{to{transform:rotate(360deg)}}
#tg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:20;width:42px;height:42px;border-radius:50%;padding:0;font-size:19px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh)}
#toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
.hero{background:linear-gradient(135deg,var(--pr),#0f6b3a 60%,var(--ac));color:#fff;border-radius:20px;padding:28px;margin-bottom:16px}.hero h1{font-size:30px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{cursor:pointer}.tile:hover{transform:translateY(-3px)}
nav a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}nav a{display:flex;align-items:center;gap:10px}nav a.on .ic{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.ic{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.18);flex-shrink:0}
.tile .ic{width:48px;height:48px;font-size:24px;border-radius:14px}
.tiles .card{background:linear-gradient(160deg,var(--card),var(--bg));transition:.2s}.tiles .card:hover{box-shadow:0 12px 30px rgba(31,157,85,.2);border-color:var(--pr)}
.credit{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;padding:10px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(31,157,85,.16),rgba(244,180,0,.22),rgba(31,157,85,.16));border:1px solid var(--bd);direction:rtl;font-weight:600;box-shadow:var(--sh)}
.credit b{background:linear-gradient(90deg,#1f9d55,#f4b400,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.cbadge{width:36px;height:36px;border-radius:50%;background:var(--card);display:inline-grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.15);animation:pl 2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.12)}}
button:not(.g){background:linear-gradient(135deg,#1f9d55,#2bb673 60%,#f4b400)}
h1{background:linear-gradient(90deg,var(--pr),#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}.hero h1{background:none;color:#fff}
.card:hover{border-color:rgba(31,157,85,.45)}
html{background:var(--bg)}body{background:transparent;position:relative}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;background:radial-gradient(40% 40% at 15% 20%,rgba(168,85,247,.5),transparent 70%),radial-gradient(35% 40% at 85% 15%,rgba(56,189,248,.5),transparent 70%),radial-gradient(40% 40% at 80% 85%,rgba(244,180,0,.42),transparent 70%),radial-gradient(40% 40% at 20% 85%,rgba(236,72,153,.42),transparent 70%),radial-gradient(30% 30% at 50% 50%,rgba(34,197,94,.28),transparent 70%);animation:fl 24s ease-in-out infinite alternate}
@keyframes fl{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(3%,-3%) rotate(8deg) scale(1.1)}100%{transform:translate(-3%,3%) rotate(-8deg) scale(1.05)}}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,rgba(255,255,255,.8),transparent),radial-gradient(3px 3px at 90px 160px,#ffd36a,transparent),radial-gradient(2px 2px at 200px 40px,#9ad4ff,transparent);background-size:240px 200px;opacity:.45;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.12}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::after{opacity:.8}}:root[data-theme="dark"] body::after{opacity:.8}
.card{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav{background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px;border-inline-end:0;border-bottom:1px solid var(--bd)}nav a{white-space:nowrap}.logo{display:none}.grid{grid-template-columns:1fr}main{padding:14px}}
@media(max-width:760px){html,body{overflow-x:hidden;max-width:100%}body{display:block;min-height:100dvh}nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;z-index:15;flex-direction:row;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch}nav a{flex-direction:column;gap:3px;padding:6px 8px;font-size:10px;min-width:64px;text-align:center;white-space:nowrap;flex-shrink:0}nav a.on{box-shadow:0 4px 12px rgba(31,157,85,.35)}main{padding:58px 12px 100px;width:100%;max-width:100%}h1{font-size:22px}.hero{padding:16px}.hero h1{font-size:21px}.hero img{width:56px;height:56px}.tiles{grid-template-columns:1fr 1fr}.row select{min-width:0}textarea{min-height:120px}.credit{font-size:13px;padding:8px 10px}#tg{top:calc(8px + env(safe-area-inset-top,0px))}}
@media(max-width:760px){#toast{bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30}}

const SYS="You are a professional translator and Kurdish linguist whose specialty is Kurdish Badini (Kurmanji, Badini/Duhok dialect, written in Arabic script as used in Duhok and Zakho). Use natural everyday Badini vocabulary and grammar, not Sorani forms, and not stiff formal language. MANDATORY WORD CHOICES for Badini output (always use the word on the right, never the word on the left, in every form and context where it fits): برا → کەکو (brother); چاوانی → کوسانی (how are you / how); چدکەی → کودکەی (what are you doing); خوش → خوەش (good, nice, pleasant, well); نەخوشخانە → خەستە (hospital). Apply the same replacement to the words' inflected or attached forms (for example with suffixes). The input text may contain spelling mistakes, missing or swapped letters, missing diacritics, missing spaces, slang, speech-to-text errors or incomplete words and sentences. Always work out what the writer most likely meant from context, silently repair it, and translate that intended meaning correctly. Never translate the typo literally, never refuse, and never ask for clarification unless the text is truly impossible to understand. Output ONLY the requested result, with no commentary or markdown.";
const SRM={English:"en-US",Arabic:"ar-IQ",Turkish:"tr-TR",Persian:"fa-IR",French:"fr-FR",German:"de-DE",Spanish:"es-ES",Italian:"it-IT",Portuguese:"pt-PT",Russian:"ru-RU",Chinese:"zh-CN",Japanese:"ja-JP",Korean:"ko-KR",Hindi:"hi-IN",Urdu:"ur-PK",Dutch:"nl-NL",Greek:"el-GR"};
function SRL(){const e=document.querySelector("#vf")||document.querySelector("#xf");return(e&&SRM[e.value])||"ar-IQ"}
function mkDict(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;let rec=null,cP,cF,cS;return{onPartial:f=>{cP=f},onFinal:f=>{cF=f},onState:f=>{cS=f},async start(){rec=new R();rec.interimResults=true;rec.continuous=true;rec.lang=SRL();rec.onresult=e=>{let p="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)cF&&cF({text:t});else p+=t}cP&&cP({text:p})};rec.onstart=()=>cS&&cS({state:"listening"});rec.onend=()=>cS&&cS({state:"idle"});rec.onerror=()=>cS&&cS({state:"idle"});rec.start()},async stop(){rec&&rec.stop()}}}
function b64(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.85).split(",")[1])};im.onerror=()=>no(new Error("Could not read the image"));im.src=URL.createObjectURL(f)})}
async function ask(prompt,o={}){const body={prompt:SYS+"\n\n"+prompt};if(o.images&&o.images[0])body.image=await b64(o.images[0]);let r;try{r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("No connection to the server. Check your internet and try again.")}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Translation failed ("+r.status+")");return(j.text||"").trim()}
const tp=(t,f,to)=>`Translate the text between <t> tags ${f==="Auto-detect"?"(detect the source language first)":"from "+f} into ${to}. Preserve meaning, tone and line breaks. Fix any typos, missing letters or incomplete words in the source first (silently), then translate the intended meaning. If the target is not Badini, still translate accurately.\n<t>${t}</t>`;
function opts(sel,incAuto){return LANGS.filter(l=>incAuto||l!=="Auto-detect").map(l=>`<option${l===sel?" selected":""}>${esc(l)}</option>`).join("")}
function isKu(l){return /Kurd/.test(l)}
function save(src,out,f,to){hist.unshift({id:Date.now(),src,out,f,to});hist=hist.slice(0,300);sv("bt_h",hist);recent=[to,f,...recent.filter(x=>x!==to&&x!==f)].slice(0,5);sv("bt_r",recent)}
function speak(t,lang){if(!window.speechSynthesis)return toast("Speech synthesis is not supported in this browser");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^ku/i.test(x.lang))||vs.find(x=>/^ar/i.test(x.lang))||vs.find(x=>/^tr/i.test(x.lang));if(v){u.voice=v;u.lang=v.lang}u.rate=prof.speed;speechSynthesis.speak(u);if(!vs.some(x=>/^ku/i.test(x.lang)))toast("No Kurdish voice on this device; using the closest available voice")}
function cp(t){navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Copy failed"))}

async function doT(){const s=$("#xs").value.trim();if(!s)return toast("Enter some text");const f=$("#xf").value,t=$("#xt").value,o=$("#xo");busy(o,1);$("#xb").disabled=1;try{const r=await ask(tp(s,f,t),{onText:x=>{o.textContent=x.text}});o.textContent=r;o.dataset.t=r;o.classList.toggle("ku",isKu(t));save(s,r,f,t)}catch(e){o.textContent="";toast(e.message||"Translation failed")}$("#xb").disabled=0}

function fb(g){toast(g?"Thanks for the feedback!":"Thanks, noted. Try rephrasing the source for a better result.")}
function dict(ta,btn){if(!D)return;const el=$("#"+ta),b=$("#"+btn);const base=el.value;let fin="";D.onPartial(({text})=>{el.value=base+fin+text});D.onFinal(({text})=>{fin+=text+" ";el.value=base+fin});D.onState(({state})=>{b.textContent=state==="listening"?"⏹ Stop":"🎤 Dictate"});b.onclick=async()=>{b.textContent==="🎤 Dictate"?D.start().catch(()=>toast("Microphone permission denied")):await D.stop()}}
V.voice=()=>`<h1>Voice Translator</h1><p class="sub">Speak, translate, listen.</p><div class="card">${langRow("v","Auto-detect",BAD)}</div><div class="grid"><div class="card">${D?`<button id="vd" onclick="dict('vs','vd')">🎤 Dictate</button>`:'<div class="mu">Dictation isn’t available in this browser (needs Chromium). You can type instead.</div>'}<textarea id="vs" style="margin-top:8px" placeholder="Spoken text appears here…"></textarea><button style="margin-top:8px" onclick="voiceGo()" id="vb">Translate</button></div><div class="card"><div id="vo" class="out ku"></div><div class="row" style="margin-top:8px"><button class="g" onclick="speak($('#vo').dataset.t||'')">▶ Play</button><button class="g" onclick="speechSynthesis.pause()">⏸ Pause</button><button class="g" onclick="speechSynthesis.resume()">⏯ Resume</button><label class="mu">Speed <select id="vsp" onchange="prof.speed=+this.value;sv('bt_p',prof)" style="width:auto">${[.7,1,1.3,1.6].map(x=>`<option${x===prof.speed?" selected":""}>${x}</option>`).join("")}</select></label></div><div class="mu" style="margin-top:6px">Audio file upload isn’t supported in this build.</div></div></div>`;
async function voiceGo(){const s=$("#vs").value.trim();if(!s)return;const o=$("#vo");busy(o,1);try{const r=await ask(tp(s,$("#vf").value,$("#vt").value));o.textContent=r;o.dataset.t=r;save(s,r,$("#vf").value,$("#vt").value);speak(r)}catch(e){o.textContent="";toast(e.message)}}
V.image=()=>`<h1>Image Translator</h1><p class="sub">Read text from photos, menus, signs and scans, then translate.</p><div class="card">${langRow("i","Auto-detect",BAD)}</div><div class="grid"><div class="card"><input type="file" id="ifile" accept="image/*" onchange="$('#ip').src=URL.createObjectURL(this.files[0]);$('#ip').hidden=0"><img id="ip" hidden style="max-width:100%;margin-top:8px;border-radius:12px"><button style="margin-top:8px" onclick="imgGo()" id="ib">Extract &amp; translate</button></div><div class="card"><div id="io" class="out ku"></div></div></div>`;
async function imgGo(){const f=$("#ifile").files[0];if(!f)return toast("Choose or capture an image");const o=$("#io");busy(o,1);try{const r=await ask(`Read all text in the image (OCR), keep its layout/line structure, and translate it into ${$("#it").value}. Output first the extracted original text, then a line with ---, then the translation.`,{images:[f]});o.textContent=r;o.dataset.t=r;save("[image]",r,"Image",$("#it").value)}catch(e){o.textContent="";toast(e.message)}}
V.doc=()=>`<h1>Document Translator</h1><p class="sub">Supports TXT, SRT, CSV and Markdown files. Word, PDF, PowerPoint, Excel and media files are not supported in this build.</p><div class="card">${langRow("d","Auto-detect",BAD)}<input type="file" id="dfile" accept=".txt,.srt,.csv,.md" style="margin-top:10px"><div class="row" style="margin-top:8px"><button onclick="docGo()" id="db">Translate file</button><span id="dp" class="mu"></span></div></div><div class="card"><div id="do" class="out ku"></div><div class="row" style="margin-top:8px"><button class="g" onclick="dl(($('#do').dataset.n||'out')+'.badini.txt',$('#do').dataset.t||'')">Download</button></div></div>`;
async function docGo(){const f=$("#dfile").files[0];if(!f)return toast("Choose a file");const txt=await f.text();const parts=[];let cur="";for(const l of txt.split("\n")){if(cur.length+l.length>2500){parts.push(cur);cur=""}cur+=l+"\n"}if(cur)parts.push(cur);const o=$("#do");o.textContent="";let res=[];$("#db").disabled=1;try{for(let i=0;i<parts.length;i++){$("#dp").innerHTML=`<span class="spin"></span> Part ${i+1}/${parts.length}`;const extra=/\.srt$/i.test(f.name)?" This is an SRT subtitle file: keep numbering and timestamps unchanged, translate only the dialogue.":/\.csv$/i.test(f.name)?" This is CSV: keep the structure and delimiters, translate cell text only.":"";res.push(await ask(tp(parts[i],$("#df").value||"Auto-detect",$("#dt").value)+extra));o.textContent=res.join("\n")}o.dataset.t=res.join("\n");o.dataset.n=f.name.replace(/\.[^.]+$/,"");$("#dp").textContent="Done";save(f.name,o.dataset.t,"File",$("#dt").value)}catch(e){toast(e.message)}$("#db").disabled=0}
V.live=()=>`<h1>Live Conversation</h1><p class="sub">Person A speaks any language; Person B speaks Badini.</p><div class="grid"><div class="card"><b>Person A</b> <span class="mu">any language → Badini</span><textarea id="la" style="min-height:70px"></textarea><div class="row" style="margin-top:6px">${D?'<button class="g" id="lad" onclick="dict(\'la\',\'lad\')">🎤 Dictate</button>':""}<button onclick="liveGo('a')">Send</button></div></div><div class="card"><b>Person B</b> <span class="mu">Badini → </span><select id="lt" style="width:auto;display:inline">${opts("English")}</select><textarea id="lb" class="ku" style="min-height:70px"></textarea><div class="row" style="margin-top:6px">${D?'<button class="g" id="lbd" onclick="dict(\'lb\',\'lbd\')">🎤 Dictate</button>':""}<button onclick="liveGo('b')">Send</button></div></div></div><div class="card" id="lg"><span class="mu">Conversation appears here.</span></div>`;
async function liveGo(w){const el=$(w==="a"?"#la":"#lb"),s=el.value.trim();if(!s)return;const to=w==="a"?BAD:$("#lt").value,from=w==="a"?"Auto-detect":BAD;el.value="";const lg=$("#lg");if(lg.querySelector(".mu"))lg.innerHTML="";const d=document.createElement("div");d.className="item";d.innerHTML=`<b>${w.toUpperCase()}</b>: ${esc(s)}<br><span class="${isKu(to)?"ku":""}">…</span>`;lg.prepend(d);try{const r=await ask(tp(s,from,to));d.lastElementChild.textContent=r;const b=document.createElement("button");b.className="g";b.textContent="🔊";b.onclick=()=>speak(r);d.append(" ",b);save(s,r,from,to)}catch(e){d.lastElementChild.textContent="Error";toast(e.message)}}
const AIM={"Correct spelling & grammar":"Correct the spelling and grammar of this Badini text. Return the corrected text only.","Improve sentences":"Improve the sentences of this Badini text while keeping the meaning.","Rewrite professionally":"Rewrite this text in professional Badini.","Explain difficult words":"Explain the difficult words in this text in simple Badini, with an English gloss.","Synonyms":"Give Badini synonyms for the key words in this text.","Simplify":"Simplify this text into easy Badini.","Translate idioms":"Explain and correctly translate any idioms in this text into natural Badini equivalents.","Formal → everyday":"Convert this Badini from formal to everyday spoken style.","Everyday → formal":"Convert this Badini from everyday to formal style."};
V.ai=()=>`<h1>AI Kurdish Assistant</h1><p class="sub">Writing, grammar and style help for Badini.</p><div class="card"><select id="am">${Object.keys(AIM).map(k=>`<option>${k}</option>`).join("")}</select><textarea id="as" class="ku" style="margin-top:8px" placeholder="…"></textarea><button style="margin-top:8px" onclick="aiGo()" id="ab">Run</button></div><div class="card"><div id="ao" class="out ku"></div><button class="g" style="margin-top:8px" onclick="cp($('#ao').textContent)">Copy</button></div>`;
async function aiGo(){const s=$("#as").value.trim();if(!s)return;const o=$("#ao");busy(o,1);try{const r=await ask(AIM[$("#am").value]+"\n<t>"+s+"</t>",{onText:x=>{o.textContent=x.text}});o.textContent=r}catch(e){o.textContent="";toast(e.message)}}
V.dict=()=>`<h1>Dictionary</h1><p class="sub">Look up any word and keep your own vocabulary list.</p><div class="card"><div class="row"><input type="text" id="dw" placeholder="Word in any language" style="flex:1"><button onclick="lookup()">Look up</button></div><div id="dl" class="out" style="margin-top:10px;min-height:60px"></div><button class="g" style="margin-top:8px" onclick="addV()">+ Add to my vocabulary</button></div><div class="card"><b>My vocabulary</b>${vocab.length?vocab.map((v,i)=>`<div class="item row"><div style="flex:1"><b>${esc(v.w)}</b><div class="ku">${esc(v.m)}</div></div><button class="g" onclick="vocab.splice(${i},1);sv('bt_v',vocab);go('dict')">✕</button></div>`).join(""):'<div class="mu">Nothing yet.</div>'}</div>`;
async function lookup(){const w=$("#dw").value.trim();if(!w)return;const o=$("#dl");busy(o,1);try{const r=await ask(`Give a dictionary entry for "${w}": Badini translation(s), part of speech, a short example sentence in Badini with its English meaning, and 2 synonyms.`);o.textContent=r;o.className="out ku"}catch(e){o.textContent="";toast(e.message)}}
function addV(){const w=$("#dw").value.trim(),m=$("#dl").textContent;if(!w||!m)return;vocab.unshift({w,m:m.split("\n")[0]});sv("bt_v",vocab);go("dict")}
function list(a,key,clear){return a.length?a.map(h=>`<div class="item"><div class="mu">${esc(h.f||"")} → ${esc(h.to||"")}</div><div>${esc(h.src.slice(0,200))}</div><div class="ku">${esc(h.out.slice(0,400))}</div><div class="row"><button class="g" onclick="cpId('${key}',${h.id})">Copy</button><button class="g" onclick="delId('${key}',${h.id})">Delete</button></div></div>`).join(""):'<div class="mu">Nothing here yet.</div>'}
function cpId(k,id){cp((k==="h"?hist:fav).find(x=>x.id===id).out)}
function delId(k,id){if(k==="h"){hist=hist.filter(x=>x.id!==id);sv("bt_h",hist)}else{fav=fav.filter(x=>x.id!==id);sv("bt_f",fav)}go(k==="h"?"hist":"fav")}
V.hist=()=>`<h1>Translation History</h1><div class="card"><input type="text" placeholder="Search…" oninput="$('#hl').innerHTML=list(hist.filter(h=>(h.src+h.out).toLowerCase().includes(this.value.toLowerCase())),'h')"><div id="hl">${list(hist,"h")}</div><button class="g" style="margin-top:8px" onclick="hist=[];sv('bt_h',hist);go('hist')">Clear all</button></div>`;
V.fav=()=>`<h1>Favorites</h1><div class="card">${list(fav,"f")}</div>`;
V.set=()=>`<h1>Settings &amp; Profile</h1><div class="card"><label>Display name<input type="text" value="${esc(prof.name)}" onchange="prof.name=this.value;sv('bt_p',prof)"></label><label style="display:block;margin-top:10px">Theme<select onchange="prof.theme=this.value;sv('bt_p',prof);theme()"><option value="auto"${prof.theme==="auto"?" selected":""}>Auto</option><option value="light"${prof.theme==="light"?" selected":""}>Light</option><option value="dark"${prof.theme==="dark"?" selected":""}>Dark</option></select></label><p class="mu">History, favorites and vocabulary are stored only in this browser on this device. Cloud accounts and offline language packs are not part of this build.</p></div>`;
let CUR=(location.hash||"#home").slice(1);function go(t){CUR=t;try{location.hash=t}catch(e){}render()}
function render(){const k=V[CUR]?CUR:"home";$("#nav").innerHTML=`<div class="logo"><img src="${LOGO}" width="42" height="42" alt="Badini Translate" style="border-radius:12px;box-shadow:0 4px 12px rgba(10,40,120,.35)"><div>Badini Translate<small>وەرگێڕانی بادینی</small></div></div>`+TABS.map(x=>`<a class="${x[0]===k?"on":""}" onclick="go('${x[0]}')">${ico(x[0])}<span>${x[1]}</span></a>`).join("");$("#app").innerHTML=CR+V[k]();if(k==="set"||true)theme();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const h=(location.hash||"#home").slice(1);if(h!==CUR&&V[h]){CUR=h;render()}});theme();render();init();
</script></body></html>
